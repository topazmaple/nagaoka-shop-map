<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>長岡市 参加店舗マップ(デモ)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  #header {
    background: #1f2937;
    color: #fff;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #header span.sub {
    font-weight: normal;
    font-size: 12px;
    color: #cbd5e1;
  }
  #map { height: calc(100% - 52px); width: 100%; }
  .popup-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .popup-genre { color: #6b7280; font-size: 12px; margin-bottom: 6px; }
  .popup-coupon {
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 4px;
  }
  .locate-btn {
    position: absolute;
    bottom: 24px;
    right: 12px;
    z-index: 500;
    background: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="header">
  <span>長岡市 参加店舗マップ(デモ)</span>
  <span class="sub">OpenStreetMap + Leaflet</span>
</div>
<div style="position:relative; height: calc(100% - 52px);">
  <div id="map"></div>
  <button class="locate-btn" onclick="locateMe()">📍 現在地から探す</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
  // 長岡市のおおよその範囲(南西端・北東端の緯度経度)
  const nagaokaBounds = L.latLngBounds(
    [37.28, 138.70],  // 南西端
    [37.62, 139.05]   // 北東端
  );

  // 長岡市中心付近を初期表示し、表示範囲を市域に制限
  const map = L.map('map', {
    maxBounds: nagaokaBounds,       // これより外へはパンできない
    maxBoundsViscosity: 1.0,        // 境界での抵抗感(1.0で完全に外に出せない)
    minZoom: 11                     // 市全体が見える程度より縮小できないようにする
  }).setView([37.4468, 138.8514], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // 初期表示時に市域全体がフィットするよう調整(お好みで)
  map.fitBounds(nagaokaBounds);

  // サンプル店舗データ(仮の座標・情報)
  const shops = [
    { name: "食堂 はとや", genre: "定食・和食", coupon: "ドリンク1杯無料", lat: 37.4460, lng: 138.8510 },
    { name: "麺屋 むぎわら", genre: "ラーメン", coupon: "トッピング1品無料", lat: 37.4485, lng: 138.8532 },
    { name: "Bistro TANI", genre: "洋食・カフェ", coupon: "デザート割引", lat: 37.4432, lng: 138.8478 },
    { name: "居酒屋 楓", genre: "居酒屋", coupon: "生ビール1杯無料", lat: 37.4501, lng: 138.8560 },
    { name: "焼鳥 ことり", genre: "焼き鳥", coupon: "串1本サービス", lat: 37.4448, lng: 138.8555 },
    { name: "カフェ にわ", genre: "カフェ", coupon: "コーヒー50円引き", lat: 37.4475, lng: 138.8490 },
    { name: "寿司 なぎさ", genre: "寿司", coupon: "小鉢サービス", lat: 37.4420, lng: 138.8540 },
    { name: "パスタ工房 ソーレ", genre: "イタリアン", coupon: "パン食べ放題無料", lat: 37.4495, lng: 138.8470 }
  ];

  // マーカーをクラスタリング表示(店舗数が多くても見やすくする)
  const markers = L.markerClusterGroup();

  shops.forEach(shop => {
    const marker = L.marker([shop.lat, shop.lng]);
    marker.bindPopup(`
      <div class="popup-title">${shop.name}</div>
      <div class="popup-genre">${shop.genre}</div>
      <div class="popup-coupon">🎫 ${shop.coupon}</div>
    `);
    markers.addLayer(marker);
  });

  map.addLayer(markers);

  // 現在地表示ボタン
  let userMarker = null;
  function locateMe() {
    if (!navigator.geolocation) {
      alert("この端末では位置情報を取得できません");
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([latitude, longitude], {
        radius: 8,
        fillColor: "#2563eb",
        color: "#fff",
        weight: 2,
        fillOpacity: 1
      }).addTo(map).bindPopup("現在地").openPopup();
      map.setView([latitude, longitude], 15);
    }, () => {
      alert("位置情報を取得できませんでした");
    });
  }
</script>

</body>
</html>
